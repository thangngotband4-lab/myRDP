name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:

    runs-on: windows-latest

    timeout-minutes: 3600

    steps:

      - name: Configure Core RDP Settings

        run: |

          # Enable Remote Desktop and disable Network Level Authentication (if needed)

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force


          # Remove any existing rule with the same name to avoid duplication

          netsh advfirewall firewall delete rule name="RDP-Tailscale"


          # For testing, allow any incoming connection on port 3389

          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389


          # Restart the Remote Desktop service to ensure changes take effect

          Restart-Service -Name TermService -Force


      - name: Create RDP User with Secure Password

        run: |

          Add-Type -AssemblyName System.Security

          $charSet = @{

              Upper   = [char[]](65..90)

              Lower   = [char[]](97..122)

              Number  = [char[]](48..57)

              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))

          }

          $rawPassword = @()

          $rawPassword += $charSet.Upper | Get-Random -Count 4

          $rawPassword += $charSet.Lower | Get-Random -Count 4

          $rawPassword += $charSet.Number | Get-Random -Count 4

          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires

          Add-LocalGroupMember -Group "Administrators" -Member "RDP"

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"


          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV


          if (-not (Get-LocalUser -Name "RDP")) {

              Write-Error "User creation failed"

              exit 1

          }


      - name: Install Tailscale

        run: |

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installerPath = "$env:TEMP\tailscale.msi"


          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait

          Remove-Item $installerPath -Force


      - name: Establish Tailscale Connection

        run: |

          # Bring up Tailscale with the provided auth key and set a unique hostname

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID


          # Wait for Tailscale to assign an IP

          $tsIP = $null

          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {

              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

              Start-Sleep -Seconds 5

              $retries++

          }


          if (-not $tsIP) {

              Write-Error "Tailscale IP not assigned. Exiting."

              exit 1

          }


          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV


      # ============================================================
      # VIRTUALBOX
      # ============================================================

      - name: Install VirtualBox

        shell: powershell

        run: |

          $VBoxVersion = "7.2.18"

          $VBoxBuild = "175117"

          $VBoxUrl = "https://download.virtualbox.org/virtualbox/$VBoxVersion/VirtualBox-$VBoxVersion-$VBoxBuild-Win.exe"

          $VBoxInstaller = "$env:TEMP\VirtualBox.exe"


          Write-Host "Downloading VirtualBox $VBoxVersion..."

          Invoke-WebRequest -Uri $VBoxUrl -OutFile $VBoxInstaller


          if (-not (Test-Path $VBoxInstaller)) {

              Write-Error "VirtualBox installer was not downloaded."

              exit 1

          }


          Write-Host "Installing VirtualBox..."

          $process = Start-Process `

            -FilePath $VBoxInstaller `

            -ArgumentList "-silent", "-msiparams", "VBOX_INSTALLDESKTOPSHORTCUT=0 VBOX_INSTALLQUICKLAUNCHSHORTCUT=0 VBOX_REGISTERFILEEXTENSIONS=1 VBOX_START=0" `

            -Wait `

            -PassThru


          if ($process.ExitCode -ne 0) {

              Write-Error "VirtualBox installation failed. Exit code: $($process.ExitCode)"

              exit $process.ExitCode

          }


          Remove-Item $VBoxInstaller -Force -ErrorAction SilentlyContinue


          # Find VBoxManage

          $VBoxManage = "${env:ProgramFiles}\Oracle\VirtualBox\VBoxManage.exe"


          if (-not (Test-Path $VBoxManage)) {

              Write-Error "VBoxManage.exe was not found after installation."

              exit 1

          }


          # Add VirtualBox to PATH for this job

          $VBoxPath = Split-Path $VBoxManage

          $env:PATH = "$VBoxPath;$env:PATH"

          echo "PATH=$VBoxPath;$env:PATH" >> $env:GITHUB_ENV


          # Create VM directory

          $VMFolder = "C:\VirtualBoxVMs"

          New-Item -ItemType Directory -Path $VMFolder -Force | Out-Null


          # Configure default VirtualBox machine folder

          & $VBoxManage setproperty machinefolder $VMFolder


          Write-Host ""

          Write-Host "=========================================="

          Write-Host "        VIRTUALBOX INSTALLED"

          Write-Host "=========================================="

          Write-Host ""

          & $VBoxManage --version

          Write-Host ""

          Write-Host "VM Folder: $VMFolder"

          Write-Host ""

          Write-Host "VirtualBox installation completed successfully."


      - name: Check Virtualization Support

        shell: powershell

        run: |

          Write-Host "Checking virtualization environment..."

          Write-Host ""

          Write-Host "CPU:"

          Get-CimInstance Win32_Processor |

            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, VirtualizationFirmwareEnabled |

            Format-List


          Write-Host ""

          Write-Host "Hyper-V requirement status:"

          systeminfo.exe | Select-String "Hyper-V Requirements"


          Write-Host ""

          Write-Host "VirtualBox version:"

          & "${env:ProgramFiles}\Oracle\VirtualBox\VBoxManage.exe" --version


      - name: Verify RDP Accessibility

        run: |

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"


          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389

          if (-not $testResult.TcpTestSucceeded) {

              Write-Error "TCP connection to RDP port 3389 failed"

              exit 1

          }

          Write-Host "TCP connectivity successful!"


      - name: Maintain Connection

        run: |

          Write-Host "`n=== RDP ACCESS ==="

          Write-Host "Address: $env:TAILSCALE_IP"

          Write-Host "Username: RDP"

          Write-Host "Password: $(echo $env:RDP_CREDS)"

          Write-Host "VirtualBox: Installed"

          Write-Host "VM Folder: C:\VirtualBoxVMs"

          Write-Host "==================`n"


          # Keep runner active indefinitely (or until manually cancelled)

          while ($true) {

              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"

              Start-Sleep -Seconds 300

          }
